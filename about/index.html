<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      About · writepaper
    </title>
    <meta name="description" content="임시로 만들어 가는 페이지">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

    <script>
      (function () {
        var allowedThemes = ["light", "dark", "system"];
        var savedTheme = "system";

        try {
          savedTheme = localStorage.getItem("theme-preference") || "system";
        } catch (error) {
          savedTheme = "system";
        }

        if (allowedThemes.indexOf(savedTheme) === -1) {
          savedTheme = "system";
        }

        document.documentElement.dataset.theme = savedTheme;
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="/assets/js/theme.js" defer></script>
  </head>
  <body>
    <header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="/">
      writepaper
    </a>

    
      <nav class="site-nav" aria-label="main_page">
        
          <a
            class="site-nav__link"
            href="/"
            
          >
            Home
          </a>
        
          <a
            class="site-nav__link is-active"
            href="/about/"
            aria-current="page"
          >
            About
          </a>
        
      </nav>
    
  </div>
</header>


    <main class="main-content" id="main-content">
      <article class="page">
  <header class="page__header">
    <h1 class="page__title">About</h1>
    
      <p class="page__description">임시로 만들어 가는 페이지</p>
    
  </header>

  <div class="page__content">
    <p>kekyll 과 githup page 로 만든 간단한 페이지 입니다.</p>

<p>스타일 시트나 일부 페이지 레이아웃은 <code class="language-plaintext highlighter-rouge">Codex</code> 로만 작성했습니다.</p>

<p>여러가지 만들어 가는 중이라 변동이 잦습니다.</p>

  </div>
</article>

    </main>

    <div class="theme-switcher" role="group" aria-label="화면 테마 선택">
  <button class="theme-switcher__button" type="button" data-theme-value="light" aria-pressed="false">
    라이트
  </button>
  <button class="theme-switcher__button" type="button" data-theme-value="dark" aria-pressed="false">
    블랙
  </button>
  <button class="theme-switcher__button" type="button" data-theme-value="system" aria-pressed="false">
    시스템
  </button>
</div>

  </body>
</html>
