<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>텍스트와 코드 블로그</title>
  <style>
    .background {
      fill: #f4f4f4;
      stroke: #dadada;
    }

    .bracket {
      stroke: #303030;
    }

    .slash {
      stroke: #5f788a;
    }

    @media (prefers-color-scheme: dark) {
      .background {
        fill: #1c1d1f;
        stroke: #3e4044;
      }

      .bracket {
        stroke: #deddd8;
      }

      .slash {
        stroke: #96b5c7;
      }
    }
  </style>

  <rect class="background" x="3" y="3" width="58" height="58" rx="14" stroke-width="2"/>

  <g fill="none" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="bracket" d="M26 19 14 32l12 13"/>
    <path class="slash" d="m37 16-10 32"/>
    <path class="bracket" d="m38 19 12 13-12 13"/>
  </g>
</svg>
