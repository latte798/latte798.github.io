<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>
      writepaper
    </title>
    <meta name="description" content="simple memo share page">
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

    <script>
      (function () {
        var allowedThemes = ["light", "dark", "system"];
        var savedTheme = "system";

        try {
          savedTheme = localStorage.getItem("theme-preference") || "system";
        } catch (error) {
          savedTheme = "system";
        }

        if (allowedThemes.indexOf(savedTheme) === -1) {
          savedTheme = "system";
        }

        document.documentElement.dataset.theme = savedTheme;
      })();
    </script>
    <link rel="stylesheet" href="/assets/css/main.css">
    <script src="/assets/js/theme.js" defer></script>
  </head>
  <body>
    <header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="/">
      writepaper
    </a>

    
      <nav class="site-nav" aria-label="main_page">
        
          <a
            class="site-nav__link"
            href="/"
            
          >
            Home
          </a>
        
          <a
            class="site-nav__link"
            href="/about/"
            
          >
            About
          </a>
        
      </nav>
    
  </div>
</header>


    <main class="main-content" id="main-content">
      <article class="page">
  <header class="page__header">
    <h1 class="page__title"></h1>
    
  </header>

  <div class="page__content">
    <style type="text/css" media="screen">
  .container {
    margin: 10px auto;
    max-width: 600px;
    text-align: center;
  }
  h1 {
    margin: 30px 0;
    font-size: 4em;
    line-height: 1;
    letter-spacing: -1px;
  }
</style>

<div class="container">
  <h1>404</h1>

  <p><strong>Page not found :(</strong></p>
  <p>The requested page could not be found.</p>
</div>

  </div>
</article>

    </main>

    <div class="theme-switcher" role="group" aria-label="화면 테마 선택">
  <button class="theme-switcher__button" type="button" data-theme-value="light" aria-pressed="false">
    라이트
  </button>
  <button class="theme-switcher__button" type="button" data-theme-value="dark" aria-pressed="false">
    블랙
  </button>
  <button class="theme-switcher__button" type="button" data-theme-value="system" aria-pressed="false">
    시스템
  </button>
</div>

  </body>
</html>
